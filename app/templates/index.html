<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel de Transcrição Avançado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="h-screen flex flex-col select-none bg-gray-100 text-gray-800">

  <header class="flex items-center justify-between flex-wrap bg-white border-b border-gray-200 px-4 py-3 gap-4 shrink-0">
    <div class="flex items-center gap-x-6 gap-y-3 flex-wrap">
        
        <div>
            <label for="destino" class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">DESTINO</label>
            <div class="flex items-center">
                <input id="destino" type="text" class="w-56 md:w-64 px-3 py-2 text-gray-900 text-sm border border-gray-300 rounded-l-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Selecione um destino...">
                <button id="select-destino-btn" type="button" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-4 py-2 rounded-r-md text-sm border-t border-r border-b border-gray-300">...</button>
            </div>
        </div>

        <div class="flex items-end gap-4">
            <div>
                <label for="model-selector" class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">MODELO</label>
                <select id="model-selector" class="w-48 px-3 py-2 text-gray-900 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    <option value="whisper_base" selected>Whisper - Base</option>
                    <option value="whisper_tiny">Whisper - Tiny</option>
                    <option value="whisper_small">Whisper - Small</option>
                    <option value="whisper_medium">Whisper - Medium</option>
                    <option value="whisper_large">Whisper - Large</option>
                    <option value="vosk">Vosk</option>
                </select>
            </div>
            <div class="flex items-center pb-2">
                <input id="keep-structure-checkbox" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" checked> <label for="keep-structure-checkbox" class="ml-2 block text-sm text-gray-900">Manter estrutura</label>
            </div>
        </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="start-btn" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-md text-sm transition-all"><i class="fas fa-play"></i>INICIAR</button>
      <button id="pause-btn" class="hidden flex items-center gap-2 bg-yellow-500 hover:bg-yellow-600 text-white font-bold px-4 py-2 rounded-md text-sm transition-all"><i class="fas fa-pause"></i>PAUSAR</button>
      <button id="resume-btn" class="hidden flex items-center gap-2 bg-green-500 hover:bg-green-600 text-white font-bold px-4 py-2 rounded-md text-sm transition-all"><i class="fas fa-play"></i>RETOMAR</button>
      <button id="stop-btn" class="hidden flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-md text-sm transition-all"><i class="fas fa-stop"></i>PARAR</button>
      <button id="settings-btn" class="text-gray-500 hover:text-blue-600 px-2 py-2 rounded-md transition-colors"><i class="fas fa-cog fa-lg"></i></button>
    </div>
  </header>

  <main id="drop-zone" class="flex-1 flex flex-col lg:flex-row p-4 gap-4 overflow-y-auto lg:overflow-y-hidden">
    <section class="flex flex-col w-full lg:w-1/3 bg-white rounded-lg border border-gray-200 shadow-sm">
        <header class="flex items-center justify-between px-4 py-3 border-b border-gray-200 shrink-0">
            <h2 class="text-base font-semibold text-gray-800">Fila de Processamento</h2>
            <div class="flex items-center gap-4">
              <button id="expand-all-btn" title="Expandir tudo" class="text-sm font-semibold text-gray-600 hover:text-blue-600"><i class="fas fa-plus-square"></i></button>
              <button id="collapse-all-btn" title="Recolher tudo" class="text-sm font-semibold text-gray-600 hover:text-blue-600"><i class="fas fa-minus-square"></i></button>
              <button id="add-folder-btn" title="Adicionar pasta de arquivos" class="flex items-center gap-2 text-sm font-semibold text-gray-700 hover:text-blue-600"><i class="fas fa-folder-plus"></i></button>
              <button id="add-file-btn" title="Adicionar arquivos avulsos" class="flex items-center gap-2 text-sm font-semibold text-gray-700 hover:text-blue-600"><i class="fas fa-plus"></i></button>
              <button id="clear-queue-btn" title="Limpar a fila" class="flex items-center gap-2 text-sm font-semibold text-gray-700 hover:text-red-600"><i class="fas fa-trash-alt"></i></button>
            </div>
        </header>
        <div id="file-tree-container" class="flex-1 overflow-y-auto scrollbar-thin p-2">
            </div>
    </section>

    <section class="flex flex-col w-full lg:w-1/3 bg-white rounded-lg border border-gray-200 shadow-sm">
        <header class="px-4 py-3 border-b border-gray-200 shrink-0">
            <h2 class="text-base font-semibold text-gray-800">Em Progresso</h2>
        </header>
        <ul id="in-progress-list" class="flex-1 overflow-y-auto scrollbar-thin">
            </ul>
    </section>

    <section class="flex flex-col w-full lg:w-1/3 bg-white rounded-lg border border-gray-200 shadow-sm">
        <header class="flex items-center justify-between px-4 py-3 border-b border-gray-200 shrink-0">
            <h2 class="text-base font-semibold text-gray-800">Concluídos</h2>
            <button id="clear-completed-btn" title="Limpar lista de concluídos" class="flex items-center gap-2 text-sm font-semibold text-gray-700 hover:text-gray-900"><i class="fas fa-broom"></i></button>
        </header>
        <ul id="completed-list" class="flex-1 overflow-y-auto scrollbar-thin">
            </ul>
    </section>
  </main>
  
  <div id="drop-zone-overlay" class="hidden fixed inset-0 bg-blue-500 bg-opacity-20 border-4 border-dashed border-blue-600 rounded-lg flex items-center justify-center pointer-events-none z-50">
      <div class="text-center text-blue-800 font-bold text-2xl">
          <i class="fas fa-folder-plus fa-3x"></i>
          <p class="mt-4">Arraste e solte uma pasta para adicionar à fila</p>
      </div>
  </div>

  <footer class="bg-white border-t border-gray-200 px-4 py-2 text-sm shrink-0">
    <div class="w-full">
        <p id="progress-text-general" class="text-center text-xs mb-1 text-gray-600">Pronto para iniciar. Adicione arquivos ou pastas à fila.</p>
        <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
            <div id="progress-bar-general" class="h-2 bg-blue-600 rounded-full transition-width duration-300" style="width: 0%;"></div>
        </div>
    </div>
  </footer>

  <div id="contextMenu" class="hidden fixed z-50 w-56 bg-white rounded-md shadow-lg border py-1 text-sm"></div>
  
  <div id="settings-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-40">
      <div class="bg-white rounded-lg shadow-xl w-full max-w-md">
          <div class="flex justify-between items-center p-4 border-b">
              <h3 class="text-lg font-semibold">Configurações</h3>
              <button id="close-settings-modal" class="text-gray-500 hover:text-gray-800">&times;</button>
          </div>
          <div class="p-6 space-y-4">
              <div>
                  <label for="max-concurrent-tasks" class="block text-sm font-medium text-gray-700">Processos Simultâneos (1-16)</label>
                  <input type="number" id="max-concurrent-tasks" name="max-concurrent-tasks" min="1" max="16" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
              </div>
              <div class="flex items-center mt-4">
                  <input id="dark-mode-toggle" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                  <label for="dark-mode-toggle" class="ml-2 block text-sm text-gray-900">Tema escuro</label>
              </div>
          </div>
          <div class="flex justify-end p-4 bg-gray-50 border-t rounded-b-lg">
              <button id="save-settings-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md">Salvar</button>
          </div>
      </div>
  </div>

  <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
